backend:
  name: github
  repo: jonhbretas/resolve-llc
  branch: main
  base_url: https://sveltia-cms-auth.jonathanbretas.workers.dev
  auth_methods:
    - oauth

media_folder: uploads
public_folder: /uploads

collections:
  - name: pages
    label: Pages
    files:
      - label: Home
        name: home
        file: src/_data/pages/home.json
        format: json
        fields:
          - label: SEO Settings
            name: seo
            widget: object
            hint: "Controls the browser title and search/social description for the homepage. This content is not visible in the page body."
            fields:
              - label: SEO Title
                name: title
                widget: string
                hint: "Appears in the browser tab and search results as the homepage title."

              - label: SEO Description
                name: description
                widget: text
                hint: "Used as the homepage meta description for search engines and previews."

          - label: Hero Section
            name: hero
            widget: object
            hint: "Controls the first full-screen section at the top of the homepage."
            fields:
              - label: Main Headline
                name: title
                widget: object
                hint: "The large headline over the hero image. Each field appears on its own line."
                fields:
                  - label: Headline Line 1
                    name: line1
                    widget: string
                    hint: "First line of the large hero headline."

                  - label: Headline Line 2
                    name: line2
                    widget: string
                    hint: "Second line of the large hero headline."

                  - label: Italic Headline Line
                    name: emphasis
                    widget: string
                    hint: "Final italic line of the large hero headline."

              - label: Hero Body Paragraphs
                name: paragraphs
                widget: list
                hint: "Short paragraphs below the hero headline. Each list item becomes one paragraph."

              - label: Hero CTA Label
                name: ctaLabel
                widget: string
                hint: "Text on the hero button below the opening paragraphs."

          - label: Intro Section
            name: approach
            widget: object
            hint: "Controls the section immediately below the hero, beside the second homepage image."
            fields:
              - label: Section Heading
                name: heading
                widget: object
                hint: "Main heading for the intro section. The emphasized word appears in italic."
                fields:
                  - label: Heading Text
                    name: text
                    widget: string
                    hint: "The normal text before the italic word in the intro heading."

                  - label: Emphasized Word
                    name: emphasis
                    widget: string
                    hint: "The italic word at the end of the intro heading."

              - label: Section Paragraphs
                name: paragraphs
                widget: list
                hint: "Paragraphs under the intro heading. Each list item becomes one paragraph."

              - label: Footer Tagline
                name: footerTag
                widget: string
                hint: "Small uppercase tagline at the bottom of the intro section."

          - label: Featured/Advisory Section
            name: oneSide
            widget: object
            hint: "Controls the section explaining that Resolve advises one side, next to the third homepage image."
            fields:
              - label: Section Heading
                name: heading
                widget: object
                hint: "Two-line heading for the advisory section."
                fields:
                  - label: Heading Line 1
                    name: line1
                    widget: string
                    hint: "First line of the advisory section heading."

                  - label: Heading Line 2
                    name: line2
                    widget: string
                    hint: "Second line of the advisory section heading."

              - label: Section Paragraphs
                name: paragraphs
                widget: list
                hint: "Paragraphs explaining the advisory role. Each list item becomes one paragraph."

              - label: Italic Closing Line
                name: italic
                widget: string
                hint: "Italic sentence shown below the advisory section paragraphs."

          - label: Conflict Escalation Section
            name: escalation
            widget: object
            hint: "Controls the full-width section about why conflicts escalate, with a quote on the right."
            fields:
              - label: Section Heading
                name: heading
                widget: object
                hint: "Three-line heading on the left side of the conflict escalation section."
                fields:
                  - label: Heading Line 1
                    name: line1
                    widget: string
                    hint: "First line of the escalation section heading."

                  - label: Heading Line 2
                    name: line2
                    widget: string
                    hint: "Second line of the escalation section heading."

                  - label: Heading Line 3
                    name: line3
                    widget: string
                    hint: "Third line of the escalation section heading."

              - label: Section Paragraphs
                name: paragraphs
                widget: list
                hint: "Body paragraphs on the left side of the escalation section. Each list item becomes one paragraph."

              - label: Quote
                name: quote
                widget: text
                hint: "Large italic quote shown on the right side of the escalation section."

          - label: Situations Section
            name: useCases
            widget: object
            hint: "Controls the three-column section describing where this work is most useful."
            fields:
              - label: Section Heading
                name: heading
                widget: string
                hint: "Large heading above the three situations columns."

              - label: Intro Paragraphs
                name: intro
                widget: list
                hint: "Short intro paragraphs below the situations heading. Each list item becomes one paragraph."

              - label: Columns
                name: columns
                widget: list
                summary: "{{title}}"
                hint: "The three visible columns in the situations section. Keep these aligned with the existing layout."
                fields:
                  - label: Column Heading
                    name: title
                    widget: string
                    hint: "Heading shown at the top of this situations column."

                  - label: Items
                    name: items
                    widget: list
                    hint: "Bullet items in this situations column. Each list item becomes one bullet."

          - label: CTA Banner
            name: ctaBanner
            widget: object
            hint: "Controls the call-to-action strip near the bottom of the homepage, just above the footer."
            fields:
              - label: CTA Text
                name: text
                widget: string
                hint: "Sentence shown on the left side of the bottom CTA banner."

              - label: CTA Button Label
                name: ctaLabel
                widget: string
                hint: "Text on the button in the bottom CTA banner."

      - label: About
        name: about
        file: src/_data/pages/about.json
        format: json
        fields:
          - label: SEO Settings
            name: seo
            widget: object
            hint: "Controls the browser title and search/social description for the About page."
            fields:
              - label: SEO Title
                name: title
                widget: string
                hint: "Appears in the browser tab and search results for the About page."

              - label: SEO Description
                name: description
                widget: text
                hint: "Used as the About page meta description."

          - label: Hero Section
            name: hero
            widget: object
            hint: "Controls the opening About section with the portrait background, pullquote, pillars, and button."
            fields:
              - label: Small Label
                name: label
                widget: string
                hint: "Small label above the main About headline."

              - label: Main Headline
                name: heading
                widget: object
                hint: "Two-line headline in the About hero."
                fields:
                  - label: Headline Line 1
                    name: line1
                    widget: string

                  - label: Headline Line 2
                    name: line2
                    widget: string

              - label: Intro Paragraphs
                name: paragraphs
                widget: list
                hint: "Paragraphs under the main About headline. Each list item becomes one paragraph."

              - label: Pullquote
                name: pullquote
                widget: object
                hint: "Italic pullquote below the intro paragraphs."
                fields:
                  - label: Pullquote Line 1
                    name: line1
                    widget: string

                  - label: Pullquote Line 2
                    name: line2
                    widget: string

                  - label: Emphasized Word
                    name: emphasis
                    widget: string
                    hint: "Italic final word in the pullquote."

              - label: Pillars
                name: pillars
                widget: list
                summary: "{{title}}"
                hint: "The three small text blocks beneath the About hero intro. Icons are fixed by the template."
                fields:
                  - label: Pillar Title
                    name: title
                    widget: string

                  - label: Pillar Body
                    name: body
                    widget: text

              - label: Hero Button Label
                name: ctaLabel
                widget: string
                hint: "Text on the About hero button."

          - label: Conflict Section
            name: conflict
            widget: object
            hint: "Controls the 'How I see conflict' section beside the second About image."
            fields:
              - label: Small Label
                name: label
                widget: string

              - label: Section Heading
                name: heading
                widget: string

              - label: Section Paragraphs
                name: paragraphs
                widget: list
                hint: "Paragraphs in the conflict section. Each list item becomes one paragraph."

          - label: Principles Section
            name: principles
            widget: list
            summary: "{{number}} — {{heading}}"
            hint: "The repeated numbered principles near the bottom of the About page."
            fields:
              - label: Number
                name: number
                widget: string
                hint: "Visible number for this principle, such as 01."

              - label: Heading
                name: heading
                widget: string

              - label: Paragraphs
                name: paragraphs
                widget: list
                hint: "Body paragraphs for this principle."

          - label: CTA Banner
            name: ctaBanner
            widget: object
            hint: "Controls the call-to-action banner above the footer."
            fields:
              - label: CTA Text
                name: text
                widget: string

              - label: CTA Button Label
                name: ctaLabel
                widget: string

      - label: How It Works
        name: howItWorks
        file: src/_data/pages/howItWorks.json
        format: json
        fields:
          - label: SEO Settings
            name: seo
            widget: object
            hint: "Controls the browser title and search/social description for the How It Works page."
            fields:
              - label: SEO Title
                name: title
                widget: string

              - label: SEO Description
                name: description
                widget: text

          - label: Hero Section
            name: hero
            widget: object
            hint: "Controls the opening How It Works hero beside the hero image."
            fields:
              - label: Small Label
                name: label
                widget: string

              - label: Kicker Text
                name: kicker
                widget: string
                hint: "Small line under the label. It currently begins with a line break to match the existing layout."

              - label: Main Headline
                name: heading
                widget: string

              - label: Body Paragraphs
                name: paragraphs
                widget: list
                hint: "Paragraphs below the hero headline."

          - label: Process Section
            name: process
            widget: object
            hint: "Controls the three process steps."
            fields:
              - label: Section Label
                name: label
                widget: string

              - label: Steps
                name: steps
                widget: list
                summary: "{{number}} — {{title}}"
                fields:
                  - label: Number
                    name: number
                    widget: string

                  - label: Step Title
                    name: title
                    widget: string

                  - label: Intro Paragraphs
                    name: bodyBefore
                    widget: list
                    hint: "Paragraphs shown before the bullet list in this step."

                  - label: Bullet Items
                    name: items
                    widget: list
                    hint: "Bullet items for this process step."

                  - label: Closing Paragraphs
                    name: bodyAfter
                    widget: list
                    hint: "Paragraphs shown after the bullet list in this step."

          - label: Selectivity and Engagement Section
            name: engagement
            widget: object
            hint: "Controls the two dark columns below the process section."
            fields:
              - label: Columns
                name: columns
                widget: list
                summary: "{{title}}"
                fields:
                  - label: Column Title
                    name: title
                    widget: string

                  - label: Paragraphs
                    name: paragraphs
                    widget: list

                  - label: Bullet Items
                    name: items
                    widget: list
                    hint: "Optional bullet list for this column."

          - label: CTA Banner
            name: ctaBanner
            widget: object
            hint: "Controls the call-to-action banner above the footer."
            fields:
              - label: CTA Text
                name: text
                widget: string

              - label: CTA Button Label
                name: ctaLabel
                widget: string

      - label: Situations
        name: situations
        file: src/_data/pages/situations.json
        format: json
        fields:
          - label: SEO Settings
            name: seo
            widget: object
            hint: "Controls the browser title and search/social description for the Situations page."
            fields:
              - label: SEO Title
                name: title
                widget: string

              - label: SEO Description
                name: description
                widget: text

          - label: Hero Section
            name: hero
            widget: object
            hint: "Controls the opening Situations hero beside the hero image."
            fields:
              - label: Small Label
                name: label
                widget: string

              - label: Main Headline
                name: heading
                widget: string

              - label: Body Paragraphs
                name: paragraphs
                widget: list

          - label: Situation Cards
            name: cards
            widget: list
            summary: "{{title}}"
            hint: "The six cards in the Situations grid. Icons and card layout are fixed by the template."
            fields:
              - label: Card Title
                name: title
                widget: string

              - label: Card Body
                name: body
                widget: text

          - label: Closing CTA
            name: closingCta
            widget: object
            hint: "Controls the text link section below the Situations cards."
            fields:
              - label: CTA Text
                name: text
                widget: string

              - label: CTA Link Label
                name: ctaLabel
                widget: string
                hint: "Text for the text-style link. The arrow spacing is preserved in this value."

      - label: FAQ
        name: faq
        file: src/_data/pages/faq.json
        format: json
        fields:
          - label: SEO Settings
            name: seo
            widget: object
            hint: "Controls the browser title and search/social description for the FAQ page."
            fields:
              - label: SEO Title
                name: title
                widget: string

              - label: SEO Description
                name: description
                widget: text

          - label: Hero Section
            name: hero
            widget: object
            hint: "Controls the opening FAQ hero beside the hero image."
            fields:
              - label: Small Label
                name: label
                widget: string

              - label: Main Headline
                name: heading
                widget: string

              - label: Body Paragraphs
                name: paragraphs
                widget: list

          - label: FAQ Groups
            name: groups
            widget: list
            summary: "{{label}}"
            hint: "Question groups in the accordion. The accordion behavior is fixed by the template."
            fields:
              - label: Group Label
                name: label
                widget: string

              - label: Questions
                name: items
                widget: list
                summary: "{{question}}"
                fields:
                  - label: Question
                    name: question
                    widget: string

                  - label: Answer Paragraphs
                    name: answer
                    widget: list
                    hint: "Each list item becomes one paragraph in the answer."

          - label: CTA Banner
            name: ctaBanner
            widget: object
            hint: "Controls the bottom CTA section above the footer."
            fields:
              - label: CTA Text
                name: text
                widget: string
                hint: "Text supports the existing <br> line break used in this banner."

              - label: CTA Button Label
                name: ctaLabel
                widget: string

      - label: Insights Page
        name: insights
        file: src/_data/pages/insights.json
        format: json
        fields:
          - label: SEO Settings
            name: seo
            widget: object
            hint: "Controls the browser title and search/social description for the Insights landing page."
            fields:
              - label: SEO Title
                name: title
                widget: string

              - label: SEO Description
                name: description
                widget: text

          - label: Hero Section
            name: hero
            widget: object
            hint: "Controls the opening Insights hero beside the hero image."
            fields:
              - label: Small Label
                name: label
                widget: string

              - label: Main Headline
                name: heading
                widget: string

              - label: Body Paragraphs
                name: paragraphs
                widget: list

          - label: Featured Insight Section
            name: featured
            widget: object
            hint: "Controls the static featured text block above the blog post list."
            fields:
              - label: Featured Title
                name: title
                widget: string

              - label: Featured Excerpt
                name: excerpt
                widget: text

          - label: Blog List Heading
            name: listIntro
            widget: object
            hint: "Controls the label and heading immediately above the dynamic blog post cards."
            fields:
              - label: Small Label
                name: label
                widget: string

              - label: Heading
                name: heading
                widget: string

          - label: CTA Banner
            name: ctaBanner
            widget: object
            hint: "Controls the call-to-action banner above the footer."
            fields:
              - label: CTA Text
                name: text
                widget: string

              - label: CTA Button Label
                name: ctaLabel
                widget: string

  - name: settings
    label: Site Settings
    files:
      - label: Contact Modal
        name: contactModal
        file: src/_data/site.json
        format: json
        fields:
          - label: Contact Modal
            name: contactModal
            widget: object
            hint: "Controls the text inside the modal opened by Request a conversation buttons."
            fields:
              - label: Close Button Label
                name: closeLabel
                widget: string
                hint: "Accessible label for the modal close button."

              - label: Eyebrow
                name: eyebrow
                widget: string
                hint: "Small label at the top of the modal intro."

              - label: Modal Title
                name: title
                widget: string
                hint: "Large title at the top of the modal intro."

              - label: Intro Paragraphs
                name: introParagraphs
                widget: list
                hint: "Opening paragraphs before the modal subsections. Each item becomes one paragraph."

              - label: Content Sections
                name: sections
                widget: list
                summary: "{{heading}}"
                hint: "Repeated content sections in the modal. The design and order are controlled by the template."
                fields:
                  - label: Section Heading
                    name: heading
                    widget: string

                  - label: Paragraphs Before List
                    name: paragraphs
                    widget: list
                    hint: "Paragraphs shown below this section heading."

                  - label: Bullet Items
                    name: items
                    widget: list
                    hint: "Optional bullet items for this section."

                  - label: Paragraphs After List
                    name: closingParagraphs
                    widget: list
                    hint: "Optional paragraphs shown after the bullet list."

              - label: Confirmation Checkbox Text
                name: confirmationLabel
                widget: string
                hint: "Text beside the checkbox the user must select before continuing."

              - label: Continue Button Label
                name: continueButtonLabel
                widget: string
                hint: "Button text that moves from the note to the embedded form."

              - label: Back Button Label
                name: backButtonLabel
                widget: string
                hint: "Button text shown above the embedded form."

              - label: Form Step Title
                name: formTitle
                widget: string
                hint: "Heading shown above the embedded scheduling form."

              - label: Success Message
                name: successMessage
                widget: text
                hint: "Message shown after the embedded form reports a completed submission."

  - name: insights
    label: Insights
    label_singular: Insight
    folder: src/posts
    create: true
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string

      - label: Slug
        name: slug
        widget: string
        hint: "Use lowercase letters, no spaces. Example: resolving-family-conflict"

      - label: SEO Description
        name: description
        widget: text
        required: false

      - label: Publish Date
        name: date
        widget: datetime

      - label: Cover Image
        name: coverImage
        widget: image
        required: false

      - label: Published
        name: published
        widget: boolean
        default: true

      - label: Body
        name: body
        widget: markdown
