backend:
  name: github
  repo: jonhbretas/resolve-llc
  branch: main
  base_url: https://sveltia-cms-auth.jonathanbretas.workers.dev
  auth_methods:
    - oauth

media_folder: uploads
public_folder: /uploads

collections:
  - name: insights
    label: Insights
    label_singular: Insight
    folder: src/posts
    create: true
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string

      - label: Slug
        name: slug
        widget: string
        hint: "Use lowercase letters, no spaces. Example: resolving-family-conflict"

      - label: SEO Description
        name: description
        widget: text
        required: false

      - label: Publish Date
        name: date
        widget: datetime

      - label: Cover Image
        name: coverImage
        widget: image
        required: false

      - label: Published
        name: published
        widget: boolean
        default: true

      - label: Body
        name: body
        widget: markdown
